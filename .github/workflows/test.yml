name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9 # main

      - run: brew style aicodeking/pandacode

      - run: brew audit --strict --cask aicodeking/pandacode/pandacode

      - run: brew audit --strict --formula aicodeking/pandacode/pandacode
